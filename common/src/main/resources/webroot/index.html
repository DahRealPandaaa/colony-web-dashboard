<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>ColonyWeb</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <!--
      boot.js pulls in every /partials/*.html placeholder below and only then starts Alpine,
      because Alpine walks the DOM once at startup.
    -->
    <script type="module" src="/js/boot.js"></script>
</head>
<body class="h-full overflow-hidden bg-ink-950 text-slate-100 font-sans antialiased">
<div x-data="dashboard()" x-init="init()" x-cloak class="h-full">

    <!-- Waiting on /auth/me. -->
    <div class="login-wrap" x-show="!authReady">
        <div class="flex flex-col items-center gap-4">
            <span class="brand-mark w-11 h-11 animate-pulse-soft">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/>
                </svg>
            </span>
            <span class="text-[14px] text-slate-400">Connecting to the colony…</span>
        </div>
    </div>

    <div data-partial="login"></div>

    <!-- ===================== App shell ===================== -->
    <div class="shell" x-show="signedIn">

        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/>
                    </svg>
                </span>
                <span class="min-w-0">
                    <span class="brand-name block">ColonyWeb</span>
                    <span class="brand-sub block">MineColonies</span>
                </span>
            </div>

            <nav class="flex flex-col gap-0.5">
                <template x-for="t in tabs" :key="t.id">
                    <button class="nav-item" :class="tab === t.id ? 'on' : ''" @click="setTab(t.id)">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                             x-html="t.icon"></svg>
                        <span x-text="t.label"></span>
                        <span class="nav-count" x-show="tabCount(t.id) !== null"
                              x-text="num(tabCount(t.id))"></span>
                    </button>
                </template>
            </nav>

            <!-- Signed-in player, pinned to the bottom. -->
            <div class="mt-auto pt-3 border-t border-line" x-show="profile">
                <div class="flex items-center gap-2.5 px-1" x-data="{ avatarFailed: false }">
                    <img class="w-8 h-8 shrink-0 rounded-lg border border-line"
                         style="image-rendering: pixelated"
                         x-show="profile?.uuid && !avatarFailed"
                         :src="profile?.uuid ? `https://mc-heads.net/avatar/${encodeURIComponent(profile.uuid)}/32.png` : null"
                         :alt="profile?.name ? `${profile.name}'s Minecraft head` : 'Minecraft player head'"
                         @load="avatarFailed = false" @error="avatarFailed = true">
                    <span class="w-8 h-8 shrink-0 grid place-items-center rounded-lg bg-white/[0.06] border border-line
                                 text-[12px] font-bold uppercase text-accent-soft"
                          x-show="!profile?.uuid || avatarFailed"
                          x-text="(profile?.name || '?').slice(0, 2)"></span>
                    <span class="flex-1 min-w-0">
                        <span class="block text-[12.5px] font-semibold truncate" x-text="profile?.name"></span>
                        <span class="block text-[12px] text-slate-400"
                              x-text="profile?.admin ? 'Operator' : num(profile?.colonyCount) + ' colonies'"></span>
                    </span>
                    <button class="btn-icon !w-8 !h-8" @click="signOut()" title="Sign out">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/>
                        </svg>
                    </button>
                </div>
            </div>
        </aside>

        <!-- ===================== Main column ===================== -->
        <div class="min-w-0 min-h-0 flex flex-col">
            <header class="topbar">
                <div class="min-w-0 flex-1">
                    <h1 class="page-title truncate" x-text="currentTab.title"></h1>
                    <p class="page-sub truncate" x-text="currentTab.subtitle"></p>
                </div>

                <span class="chip" :class="connection === 'live' ? 'good' : (connection === 'down' ? 'bad' : '')"
                      :title="'Live update stream: ' + connection">
                    <i class="w-1.5 h-1.5 rounded-full"
                       :class="connection === 'live' ? 'bg-emerald-400' : (connection === 'down' ? 'bg-rose-500' : 'bg-amber-400')"></i>
                    <span class="hidden sm:inline"
                          x-text="connection === 'live' ? 'Live' : (connection === 'down' ? 'Reconnecting' : 'Connecting')"></span>
                </span>

                <select class="field font-semibold min-w-[150px] max-w-[220px]" x-show="colonies.length > 1"
                        x-model.number="colonyId" @change="selectColony(colonyId)">
                    <template x-for="c in colonies" :key="c.id">
                        <option :value="c.id" x-text="c.name"></option>
                    </template>
                </select>
                <span class="chip" x-show="colonies.length === 1" x-text="colonies[0]?.name"></span>

                <button class="btn-icon" @click="refresh()" title="Refresh now">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
                    </svg>
                </button>

                <!-- The sidebar carries this on wide screens, but it is hidden below lg. -->
                <button class="btn-icon lg:hidden" x-show="profile" @click="signOut()" title="Sign out">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/>
                    </svg>
                </button>
            </header>

            <!-- Sidebar replacement on narrow screens. -->
            <nav class="tabstrip">
                <template x-for="t in tabs" :key="t.id">
                    <button class="tabchip" :class="tab === t.id ? 'on' : ''" @click="setTab(t.id)" x-text="t.label"></button>
                </template>
            </nav>

            <main class="content">
                <div class="empty" x-show="!colonies.length">
                    <p class="empty-title">No colonies to show.</p>
                    <p class="mt-1">Run <span class="kbd">/colonyweb sync</span> in-game after joining a colony.</p>
                </div>

                <div x-show="colonies.length">
                    <div data-partial="overview"></div>
                    <div data-partial="map"></div>
                    <div data-partial="buildings"></div>
                    <div data-partial="needed"></div>
                    <div data-partial="citizens"></div>
                    <div data-partial="research"></div>
                    <div data-partial="combat"></div>
                    <div data-partial="warehouse"></div>
                </div>
            </main>
        </div>
    </div>

    <div data-partial="modal-building"></div>
    <div data-partial="modal-citizen"></div>
</div>
</body>
</html>
