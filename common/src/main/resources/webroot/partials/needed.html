<template x-if="tab === 'needed'">
    <div class="animate-fade-up">
        <div class="toolbar">
            <div class="searchbox flex-1 min-w-[200px]">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
                </svg>
                <input type="search" placeholder="Search items or materials…" x-model="needSearch">
            </div>
            <select class="field py-1.5" x-model="needSort" aria-label="Sort missing items">
                <option value="shortfall">Biggest gap</option>
                <option value="alpha">Name</option>
            </select>
            <span class="chip on ml-auto" x-text="num(neededTotal) + ' items to find'"></span>
        </div>

        <!-- Same card as the per-building requirement list, with the colony-wide totals. -->
        <div class="grid grid-auto-items gap-2.5">
            <template x-for="(n, ni) in neededItems" :key="ni">
                <div class="mc-tip flex items-center gap-3">
                    <img class="mc-icon" loading="lazy" :src="textureUrl(n.itemKey)" :alt="n.name">
                    <div class="flex-1 min-w-0">
                        <div class="mc-head">
                            <div class="mc-name" x-text="n.name"></div>
                            <span class="craft-mark" x-show="n.craftable" title="A colony worker can craft this">
                                <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor"
                                     stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 3l7 7-4 4-7-7z"/><path d="M11 7L3 15v6h6l8-8"/>
                                </svg>
                            </span>
                        </div>
                        <div class="mc-line" x-show="n.craftedIn">Crafted in the <span class="mc-val" x-text="n.craftedIn"></span></div>
                        <div class="mc-line" x-show="n.variant">Type: <span class="mc-val" x-text="n.variant"></span></div>
                        <template x-for="(c, cx) in (n.components || [])" :key="cx">
                            <div class="mc-line"><span x-text="c.label"></span>: <span class="mc-val" x-text="c.material"></span></div>
                        </template>
                        <div class="mc-line">
                            Needed by <span class="mc-val" x-text="n.sites"></span>
                            <span x-text="n.sites === 1 ? 'site' : 'sites'"></span> ·
                            Hut <span class="mc-val" x-text="n.inHut"></span> ·
                            Warehouse <span class="mc-val" x-text="n.inWarehouse"></span>
                        </div>
                    </div>
                    <div class="text-right shrink-0">
                        <div class="mc-count" x-text="stacks(n.shortfall, n.maxStackSize)"></div>
                        <span class="pill missing mt-1.5">Missing</span>
                    </div>
                </div>
            </template>
        </div>

        <div class="empty" x-show="!neededItems.length">
            <p class="empty-title" x-show="neededAll.length">No missing items match your search.</p>
            <p class="empty-title" x-show="!neededAll.length">Nothing is missing — every site has what it needs.</p>
        </div>
    </div>
</template>
