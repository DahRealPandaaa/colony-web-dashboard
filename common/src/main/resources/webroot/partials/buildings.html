<template x-if="tab === 'buildings'">
    <div class="animate-fade-up">
        <div class="toolbar">
            <div class="searchbox flex-1 min-w-[200px]">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
                </svg>
                <input type="search" placeholder="Search buildings, items or materials…" x-model="search">
            </div>
            <label class="switch">
                <input type="checkbox" x-model="onlyInProgress"><span class="track"></span>
                <span class="switch-label">In progress only</span>
            </label>
            <label class="switch">
                <input type="checkbox" x-model="showDecorations"><span class="track"></span>
                <span class="switch-label">Decorations</span>
            </label>
            <select class="field py-1.5" x-model="sort" aria-label="Sort buildings">
                <option value="status">Missing first</option>
                <option value="progress">Progress</option>
                <option value="name">Name</option>
                <option value="level">Level</option>
            </select>
            <span class="chip on ml-auto" x-text="visibleBuildings.length + ' shown'"></span>
        </div>

        <div class="grid grid-auto-cards gap-3.5">
            <template x-for="b in visibleBuildings" :key="b.id">
                <article class="card card-click relative" tabindex="0"
                         :class="b.beingBuilt ? 'card-active' : ''"
                         @click="openBuilding(b)" @keydown.enter="openBuilding(b)">
                    <span class="ba b-repair absolute top-3 right-3" x-show="b.kind === 'decoration'">Deco</span>

                    <div class="flex items-center gap-3">
                        <img class="w-14 h-14 object-contain pixelated rounded-lg bg-black/25 border border-line p-0.5 shrink-0"
                             loading="lazy" :src="buildingArt(b) || buildingIcon(b)" :alt="b.name"
                             @error="buildingIconFallback($el, b)">
                        <div class="flex-1 min-w-0">
                            <span class="block font-bold text-[16px] truncate" x-text="b.name"></span>
                            <span class="text-slate-400 text-[13.5px]">Level
                                <b class="text-slate-200 tabular-nums"
                                   x-text="workOrderTargetLevel(b) ? (b.level + ' → ' + workOrderTargetLevel(b)) : b.level"></b>
                            </span>
                        </div>
                    </div>

                    <template x-if="b.beingBuilt">
                        <div class="mt-3">
                            <div class="flex items-center justify-between text-[12px]">
                                <span class="text-slate-400 truncate" x-show="builtBy(b)">Built by
                                    <b class="text-accent-soft" x-text="builtBy(b)"></b>
                                </span>
                                <span class="text-slate-400 truncate" x-show="!builtBy(b)">Queued, no builder yet</span>
                                <b class="text-accent-soft tabular-nums" x-text="buildingProgress(b) + '%'"></b>
                            </div>
                            <div class="progress"><span :style="'width:' + buildingProgress(b) + '%'"></span></div>
                        </div>
                    </template>

                    <div class="flex items-center gap-2.5 mt-3 flex-wrap" x-show="(b.required || []).length">
                        <span class="sdot ok" x-show="resourceCounts(b).ok"><i></i><b x-text="resourceCounts(b).ok"></b></span>
                        <span class="sdot deliver" x-show="resourceCounts(b).deliver"><i></i><b x-text="resourceCounts(b).deliver"></b></span>
                        <span class="sdot missing" x-show="resourceCounts(b).missing"><i></i><b x-text="resourceCounts(b).missing"></b></span>
                        <span class="ml-auto text-[12px] text-slate-400" x-text="(b.required || []).length + ' items'"></span>
                    </div>
                </article>
            </template>
        </div>

        <div class="empty" x-show="!visibleBuildings.length">
            <p class="empty-title" x-show="snap.buildings.length">No buildings match your filters.</p>
            <p class="empty-title" x-show="!snap.buildings.length">No buildings found in this colony.</p>
        </div>
    </div>
</template>
