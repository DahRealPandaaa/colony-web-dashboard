<template x-if="tab === 'overview'">
    <div class="grid grid-cols-1 xl:grid-cols-[1fr_340px] gap-4 animate-fade-up">

        <div class="min-w-0 flex flex-col gap-4">
            <!-- Headline numbers -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div class="tile">
                    <div class="tile-label">Citizens</div>
                    <div class="tile-value" x-text="stats.citizens + ' / ' + (stats.maxCitizens || '—')"></div>
                    <div class="tile-sub" x-text="stats.children + ' children · ' + stats.unemployed + ' idle'"></div>
                </div>
                <div class="tile">
                    <div class="tile-label">Happiness</div>
                    <div class="tile-value"
                         :class="stats.happiness >= 7 ? 'text-emerald-300' : (stats.happiness >= 5 ? 'text-amber-300' : 'text-rose-300')"
                         x-text="stats.happiness.toFixed(1)"></div>
                    <div class="meter happy mt-2"><span :style="'width:' + pct(stats.happiness, 10) + '%'"></span></div>
                </div>
                <div class="tile">
                    <div class="tile-label">Buildings</div>
                    <div class="tile-value" x-text="stats.buildings"></div>
                    <div class="tile-sub" x-text="stats.decorations + ' decorations · ' + stats.workOrders + ' work orders'"></div>
                </div>
                <div class="tile">
                    <div class="tile-label">Defence</div>
                    <div class="tile-value" :class="stats.raided ? 'text-rose-300' : ''" x-text="stats.guards"></div>
                    <div class="tile-sub" :class="stats.raided ? 'text-rose-300 font-semibold' : ''"
                         x-text="stats.raided ? 'Under attack!' : (stats.nightsSinceRaid + ' nights since raid')"></div>
                </div>
                <div class="tile">
                    <div class="tile-label">Warehouse</div>
                    <div class="tile-value" x-text="num(stats.warehouseItems)"></div>
                    <div class="tile-sub" x-text="stats.warehouseTypes + ' distinct items'"></div>
                </div>
                <div class="tile">
                    <div class="tile-label">Research</div>
                    <div class="tile-value" x-text="stats.researchCompleted"></div>
                    <div class="tile-sub" x-text="stats.researchInProgress + ' in progress'"></div>
                </div>
                <div class="tile">
                    <div class="tile-label">Builders</div>
                    <div class="tile-value" x-text="stats.builders"></div>
                    <div class="tile-sub" x-text="snap.workOrders.length + ' orders queued'"></div>
                </div>
                <div class="tile">
                    <div class="tile-label">Avg. saturation</div>
                    <div class="tile-value" x-text="stats.saturation.toFixed(1)"></div>
                    <div class="meter food mt-2"><span :style="'width:' + pct(stats.saturation, 20) + '%'"></span></div>
                </div>
            </div>

            <!-- Work orders -->
            <section class="panel">
                <div class="panel-head">
                    <div>
                        <h2 class="panel-title">Work orders</h2>
                        <p class="panel-sub">Claimed orders first</p>
                    </div>
                    <span class="chip" x-text="snap.workOrders.length + ' total'"></span>
                </div>
                <div class="panel-body space-y-2">
                    <template x-for="wo in activeWorkOrders" :key="wo.id">
                        <div class="card !p-3 flex items-center gap-3">
                            <span class="ba shrink-0" :class="badgeClass(wo.action)" x-text="wo.action"></span>
                            <div class="flex-1 min-w-0">
                                <div class="font-semibold text-[14.5px] truncate"
                                     x-text="wo.buildingName || wo.buildingType || 'Structure'"></div>
                                <div class="progress"><span :style="'width:' + Math.round((wo.progress || 0) * 100) + '%'"></span></div>
                            </div>
                            <div class="text-right shrink-0">
                                <div class="text-[12px] text-slate-400 tabular-nums" x-text="wo.currentLevel + ' → ' + wo.targetLevel"></div>
                                <div class="text-[12px] font-semibold"
                                     :class="wo.builderName ? 'text-accent-soft' : 'text-slate-400'"
                                     x-text="wo.builderName || 'unclaimed'"></div>
                            </div>
                        </div>
                    </template>
                    <p class="empty" x-show="!snap.workOrders.length">Nothing is being built right now.</p>
                </div>
            </section>
        </div>

        <!-- Builders -->
        <aside class="panel self-start">
            <div class="panel-head">
                <div>
                    <h2 class="panel-title">Builders</h2>
                    <p class="panel-sub">Who is on what</p>
                </div>
                <span class="chip" x-text="snap.builders.length"></span>
            </div>
            <div class="panel-body space-y-2.5">
                <template x-for="b in snap.builders" :key="b.id">
                    <div class="card !p-3">
                        <template x-if="!builderInfo(b).idle">
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="ba" :class="badgeClass(builderInfo(b).action)" x-text="builderInfo(b).action"></span>
                                    <span class="ml-auto text-[12.5px] text-slate-400 truncate" x-text="b.name"></span>
                                </div>
                                <div class="mt-1.5 flex items-baseline gap-2">
                                    <span class="font-semibold text-[14.5px] truncate" x-text="builderInfo(b).building"></span>
                                    <span class="text-slate-400 text-[12.5px] font-semibold tabular-nums shrink-0"
                                          x-text="builderInfo(b).current + ' → ' + builderInfo(b).target"></span>
                                </div>
                                <div class="progress"><span :style="'width:' + builderInfo(b).pct + '%'"></span></div>
                                <div class="text-accent-soft text-[11.5px] font-bold tabular-nums mt-1.5"
                                     x-text="builderInfo(b).pct + '%'"></div>
                            </div>
                        </template>
                        <template x-if="builderInfo(b).idle">
                            <div>
                                <div class="font-semibold text-[14.5px]" x-text="b.name"></div>
                                <div class="text-slate-400 text-[12px] mt-0.5">Idle</div>
                            </div>
                        </template>
                    </div>
                </template>
                <p class="empty" x-show="!snap.builders.length">No builders assigned.</p>
            </div>
        </aside>
    </div>
</template>
