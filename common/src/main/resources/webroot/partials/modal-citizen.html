<div class="modal-backdrop" x-show="citizen" x-transition.opacity
     @click.self="closeCitizen()" @keydown.escape.window="closeCitizen()">
    <div class="modal-card" x-show="citizen" x-transition>
        <template x-if="citizen">
            <div>
                <div class="modal-head">
                    <div class="flex items-center gap-3.5 min-w-0">
                        <img class="w-16 h-20 object-cover object-top rounded-lg bg-black/30 border border-line shrink-0"
                             :src="citizenArt(citizen)" :alt="citizen.job"
                             @error="citizenIconFallback($el, citizen)">
                        <div class="min-w-0">
                            <h3 class="text-[21px] font-bold tracking-tight flex items-center gap-2.5 flex-wrap">
                                <span x-text="citizen.name"></span>
                                <span class="chip on" x-text="citizen.job"></span>
                                <span class="ba b-repair" x-show="citizen.child">Child</span>
                            </h3>
                            <div class="flex gap-3 text-slate-400 text-[13.5px] mt-1 flex-wrap">
                                <span x-show="citizen.workBuilding" x-text="'Works at ' + citizen.workBuilding"></span>
                                <span x-show="citizen.homeBuilding" x-text="'Lives at ' + citizen.homeBuilding"></span>
                                <span class="tabular-nums" x-text="citizen.x + ', ' + citizen.y + ', ' + citizen.z"></span>
                            </div>
                        </div>
                    </div>
                    <button class="btn-icon shrink-0" @click="closeCitizen()" aria-label="Close">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                    </button>
                </div>

                <div class="modal-body">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div class="tile">
                            <div class="tile-label">Health</div>
                            <div class="tile-value" x-text="citizen.health.toFixed(0)"></div>
                            <div class="meter hp mt-2"><span :style="'width:' + pct(citizen.health, citizen.maxHealth) + '%'"></span></div>
                        </div>
                        <div class="tile">
                            <div class="tile-label">Saturation</div>
                            <div class="tile-value" x-text="citizen.saturation.toFixed(1)"></div>
                            <div class="meter food mt-2"><span :style="'width:' + pct(citizen.saturation, 20) + '%'"></span></div>
                        </div>
                        <div class="tile">
                            <div class="tile-label">Happiness</div>
                            <div class="tile-value" x-text="citizen.happiness.toFixed(1)"></div>
                            <div class="meter happy mt-2"><span :style="'width:' + pct(citizen.happiness, 10) + '%'"></span></div>
                        </div>
                        <div class="tile">
                            <div class="tile-label">Total skill</div>
                            <div class="tile-value" x-text="citizen.skillTotal"></div>
                            <div class="tile-sub" x-text="citizen.status || (citizen.spawned ? 'In the world' : 'Not loaded')"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mt-5">
                        <section class="min-w-0">
                            <h4 class="panel-title mb-2.5">Skills</h4>
                            <div class="space-y-2">
                                <template x-for="s in citizen.skills" :key="s.name">
                                    <div>
                                        <div class="flex items-center justify-between text-[12.5px] mb-1">
                                            <span class="flex items-center gap-1.5">
                                                <span x-text="s.name"></span>
                                                <span class="ba b-upgrade" x-show="s.role" x-text="s.role"></span>
                                            </span>
                                            <b class="tabular-nums text-violet-300" x-text="s.level"></b>
                                        </div>
                                        <div class="meter xp"><span :style="'width:' + pct(s.level, 99) + '%'"></span></div>
                                    </div>
                                </template>
                                <p class="empty !py-3" x-show="!citizen.skills.length">No skill data.</p>
                            </div>

                            <h4 class="panel-title mt-6 mb-2.5">Perks &amp; grievances</h4>
                            <div class="flex flex-wrap gap-1.5">
                                <template x-for="(m, mi) in citizen.modifiers" :key="mi">
                                    <span class="chip" :class="m.factor > 1 ? 'good' : (m.factor < 1 ? 'bad' : '')">
                                        <span x-text="m.name"></span>
                                        <b class="tabular-nums" x-text="'×' + m.factor.toFixed(2)"></b>
                                    </span>
                                </template>
                                <p class="empty !py-3" x-show="!citizen.modifiers.length">Nothing notable.</p>
                            </div>
                        </section>

                        <section class="min-w-0">
                            <div class="flex items-center justify-between mb-2.5" x-show="citizenEquipment.length">
                                <h4 class="panel-title">Equipped</h4>
                                <span class="chip" x-show="armorPointsOf(citizenEquipment)">
                                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
                                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 3l7.5 3v5.7c0 4.5-3.2 8.4-7.5 9.8-4.3-1.4-7.5-5.3-7.5-9.8V6z"/>
                                    </svg>
                                    <b class="tabular-nums" x-text="armorPointsOf(citizenEquipment)"></b>
                                </span>
                            </div>
                            <div class="flex items-center gap-1.5 flex-wrap mb-5" x-show="citizenEquipment.length">
                                <template x-for="(e, ei) in citizenEquipment" :key="ei">
                                    <span class="gear" :class="e.enchanted ? 'ench' : ''"
                                          :title="e.slot + ': ' + e.name
                                                  + (e.armorPoints ? ' (+' + e.armorPoints + ' armour)' : '')
                                                  + (e.durabilityPct < 100 ? ' · ' + e.durabilityPct + '% durability' : '')">
                                        <img class="pixelated w-full h-full" loading="lazy"
                                             :src="textureUrl(e.itemKey)" :alt="e.name">
                                    </span>
                                </template>
                            </div>

                            <div class="flex items-center justify-between mb-2.5">
                                <h4 class="panel-title">Inventory</h4>
                                <span class="chip" x-text="citizen.inventoryUsed + ' / ' + citizen.inventorySize + ' slots'"></span>
                            </div>
                            <div class="space-y-2 max-h-[46vh] overflow-y-auto pr-1">
                                <template x-for="(i, ii) in citizenInventory" :key="ii">
                                    <div class="mc-tip flex items-center gap-3">
                                        <img class="mc-icon" loading="lazy" :src="textureUrl(i.itemKey)" :alt="i.name">
                                        <div class="flex-1 min-w-0">
                                            <div class="mc-head">
                                                <div class="mc-name" x-text="i.name"></div>
                                                <span class="craft-mark" x-show="i.craftable" title="A colony worker can craft this">
                                                    <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor"
                                                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                                        <path d="M14 3l7 7-4 4-7-7z"/><path d="M11 7L3 15v6h6l8-8"/>
                                                    </svg>
                                                </span>
                                            </div>
                                            <div class="mc-line" x-show="i.craftedIn">Crafted in the <span class="mc-val" x-text="i.craftedIn"></span></div>
                                            <div class="mc-line" x-show="i.variant">Type: <span class="mc-val" x-text="i.variant"></span></div>
                                            <template x-for="(c, cx) in (i.components || [])" :key="cx">
                                                <div class="mc-line"><span x-text="c.label"></span>: <span class="mc-val" x-text="c.material"></span></div>
                                            </template>
                                            <div class="mc-slot" x-text="'slot ' + i.slot"></div>
                                        </div>
                                        <div class="mc-count" x-text="'x' + i.count"></div>
                                    </div>
                                </template>
                                <p class="empty" x-show="!citizenInventory.length">Carrying nothing.</p>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </template>
    </div>
</div>
