<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineColonies Dashboard</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js"></script>
    <script src="/vendor/alpine.min.js" defer></script>
</head>
<body class="h-screen overflow-hidden bg-ink-950 text-slate-100 font-sans">
<div x-data="dashboard()" x-init="init()" x-cloak class="h-full flex flex-col">

    <!-- Header -->
    <header class="relative h-16 flex items-center justify-between px-6 border-b border-slate-800 shrink-0">
        <div class="absolute inset-0 bg-gradient-to-b from-slate-900 to-ink-950
                    [background-image:radial-gradient(600px_240px_at_50%_-60%,rgba(59,130,246,0.18),transparent_70%)]"></div>
        <div class="relative flex items-center gap-3">
            <span class="w-10 h-10 grid place-items-center rounded-xl text-white bg-gradient-to-br from-blue-500 to-sky-400 shadow-lg shadow-blue-500/30">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/>
                </svg>
            </span>
            <h1 class="text-xl font-bold">MineColonies <span class="text-slate-400 font-medium">dashboard</span></h1>
        </div>
        <div class="relative flex items-center gap-2" x-show="colonies.length">
            <label class="text-sm text-slate-400">Colony:</label>
            <select class="field font-semibold text-blue-300 min-w-[190px]" x-model.number="colonyId" @change="selectColony(colonyId)">
                <template x-for="c in colonies" :key="c.id">
                    <option :value="c.id" x-text="'✦ ' + c.name"></option>
                </template>
            </select>
        </div>
    </header>

    <!-- Three-column layout -->
    <div class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-[300px_1fr_320px] gap-4 p-4">

        <!-- Builders -->
        <aside class="min-h-0 flex flex-col rounded-2xl border border-slate-800 bg-slate-900/50">
            <div class="px-4 pt-4 pb-2.5">
                <h2 class="text-[15px] font-bold">Builders Panel</h2>
            </div>
            <div class="flex-1 min-h-0 overflow-y-auto px-3 pb-3.5 space-y-2.5">
                <template x-for="b in snap.builders" :key="b.id">
                    <div class="flex gap-3 rounded-xl border border-slate-800 bg-slate-800/40 p-3">
                        <div class="shrink-0">
                            <svg viewBox="0 0 24 24" width="26" height="26"><rect width="24" height="24" rx="6" fill="#1e293b"/><circle cx="12" cy="9" r="4" fill="#60a5fa"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6" fill="#60a5fa"/></svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <template x-if="!builderInfo(b).idle">
                                <div>
                                    <span class="ba" :class="badgeClass(builderInfo(b).action)" x-text="builderInfo(b).action"></span>
                                    <div class="mt-1 font-semibold text-sm flex items-baseline gap-2">
                                        <span class="truncate" x-text="builderInfo(b).building"></span>
                                        <span class="text-slate-400 text-xs font-semibold shrink-0" x-text="builderInfo(b).current + ' → ' + builderInfo(b).target"></span>
                                    </div>
                                    <div class="progress"><span :style="'width:' + builderInfo(b).pct + '%'"></span></div>
                                    <div class="flex items-center justify-between mt-1.5">
                                        <span class="text-blue-300 text-xs font-bold tabular-nums" x-text="builderInfo(b).pct + '%'"></span>
                                        <span class="text-slate-500 text-[11.5px] truncate ml-2" x-text="b.name"></span>
                                    </div>
                                </div>
                            </template>
                            <template x-if="builderInfo(b).idle">
                                <div>
                                    <div class="font-semibold text-sm" x-text="b.name"></div>
                                    <div class="text-slate-500 text-xs italic mt-1">Idle</div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
                <div class="text-slate-500 italic text-sm text-center py-4" x-show="!snap.builders.length">No builders assigned.</div>
            </div>
        </aside>

        <!-- Buildings -->
        <section class="min-h-0 flex flex-col">
            <div class="flex items-center gap-3.5 flex-wrap rounded-2xl border border-slate-800 bg-slate-900/50 px-3.5 py-3 mb-3.5">
                <div class="flex items-center gap-2 flex-1 min-w-[180px] bg-ink-950 border border-slate-700 rounded-lg px-2.5 text-slate-400 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="search" class="flex-1 bg-transparent outline-none py-2 text-sm text-slate-100" placeholder="Search…" x-model="search">
                    <button class="text-slate-500 hover:text-slate-300" x-show="search" @click="search=''">✕</button>
                </div>
                <label class="switch">
                    <input type="checkbox" x-model="onlyInProgress"><span class="track"></span><span class="switch-label">In Progress Only</span>
                </label>
                <label class="switch">
                    <input type="checkbox" x-model="showDecorations"><span class="track"></span><span class="switch-label">Show Decorations</span>
                </label>
                <div class="flex items-center gap-2 text-sm text-slate-400">
                    <span>Sort by:</span>
                    <select class="field py-1.5" x-model="sort">
                        <option value="status">Missing First</option>
                        <option value="progress">Progress</option>
                        <option value="name">Name</option>
                        <option value="level">Level</option>
                    </select>
                </div>
            </div>

            <div class="flex items-center justify-between px-1 pb-2">
                <h2 class="text-[15px] font-bold">Buildings &amp; Decorations</h2>
                <span class="bg-blue-500/15 text-blue-300 border border-blue-500/25 rounded-full px-2.5 py-0.5 text-xs font-bold" x-text="filteredBuildings.length"></span>
            </div>

            <div class="flex-1 min-h-0 overflow-y-auto pr-1">
                <div class="grid grid-cols-[repeat(auto-fill,minmax(240px,1fr))] gap-4">
                    <template x-for="b in filteredBuildings" :key="b.id">
                        <article @click="openBuilding(b)" tabindex="0" @keydown.enter="openBuilding(b)"
                                 class="group relative rounded-xl border p-4 cursor-pointer overflow-hidden transition
                                        hover:-translate-y-0.5 hover:bg-slate-800 hover:shadow-xl hover:shadow-black/40 focus:outline-none"
                                 :class="b.kind === 'decoration'
                                     ? 'border-amber-500/30 bg-slate-800/40'
                                     : (b.beingBuilt ? 'border-blue-500/40 bg-slate-800/50' : 'border-slate-700/60 bg-slate-800/40')">
                            <span x-show="b.kind === 'decoration'"
                                  class="absolute top-2.5 right-2.5 bg-amber-500/15 text-amber-300 border border-amber-500/45 text-[9.5px] font-extrabold tracking-wide px-1.5 py-[3px] rounded uppercase">Decoration</span>
                            <div class="flex items-center gap-3">
                                <img class="w-11 h-11 pixelated rounded-lg bg-black/25 border border-slate-700 p-1" loading="lazy" :src="buildingIconUrl(b)" :alt="b.name">
                                <div class="flex-1 min-w-0">
                                    <span class="block font-bold text-[15px] truncate" x-text="b.name"></span>
                                    <span class="text-slate-400 text-[13px]">Level:
                                        <b class="text-slate-100" x-text="workOrderTargetLevel(b) ? (b.level + ' → ' + workOrderTargetLevel(b)) : b.level"></b>
                                    </span>
                                </div>
                            </div>
                            <div class="text-slate-400 text-[13px] mt-3" x-show="b.beingBuilt">
                                Being built by: <b class="text-blue-300" x-text="builtBy(b) || '—'"></b>
                            </div>
                            <div class="progress" x-show="b.beingBuilt"><span :style="'width:' + buildingProgress(b) + '%'"></span></div>
                            <div class="flex items-center gap-2 mt-2.5 flex-wrap" x-show="(b.required || []).length">
                                <span class="sdot ok" x-show="buildingCounts(b).ok"><i></i><b x-text="buildingCounts(b).ok"></b></span>
                                <span class="sdot deliver" x-show="buildingCounts(b).deliver"><i></i><b x-text="buildingCounts(b).deliver"></b></span>
                                <span class="sdot missing" x-show="buildingCounts(b).missing"><i></i><b x-text="buildingCounts(b).missing"></b></span>
                                <span class="ml-auto text-[11px] text-slate-500" x-text="(b.required || []).length + ' items'"></span>
                            </div>
                        </article>
                    </template>
                </div>
                <div class="text-slate-500 italic text-sm text-center py-6" x-show="!filteredBuildings.length">
                    <span x-show="search || onlyInProgress || !showDecorations">No buildings match your filters.</span>
                    <span x-show="!search && !onlyInProgress && showDecorations">No buildings found.</span>
                </div>
            </div>
        </section>

        <!-- Warehouse -->
        <aside class="min-h-0 flex flex-col rounded-2xl border border-slate-800 bg-slate-900/50">
            <div class="px-4 pt-4 pb-2.5 flex items-start justify-between cursor-pointer group" @click="openWarehouse()" title="Open full warehouse">
                <div>
                    <h2 class="text-[15px] font-bold">Warehouse Overview</h2>
                    <span class="text-slate-500 text-[11.5px]">Total stock in aggregated</span>
                </div>
                <span class="text-slate-500 group-hover:text-blue-300 text-base transition-colors">⤢</span>
            </div>
            <div class="px-4 pb-2.5 flex flex-col gap-2">
                <div class="flex items-center gap-2 bg-ink-950 border border-slate-700 rounded-lg px-2.5 text-slate-400 focus-within:border-blue-500">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="search" class="flex-1 bg-transparent outline-none py-2 text-[13px]" placeholder="Search" x-model="whSearch">
                </div>
                <div class="flex items-center gap-2 text-[13px] text-slate-400">
                    <span>Sort by</span>
                    <select class="field py-1.5 text-xs" x-model="whSort">
                        <option value="count">count</option>
                        <option value="alpha">alphabetically</option>
                    </select>
                </div>
            </div>
            <div class="flex-1 min-h-0 overflow-y-auto px-2 pb-3">
                <template x-for="s in filteredWarehouse" :key="s.itemKey">
                    <div class="flex items-center gap-2.5 px-2 py-2 rounded-lg hover:bg-slate-800/60" :title="s.name">
                        <img class="w-[22px] h-[22px] pixelated rounded bg-black/20 p-px" loading="lazy" :src="textureUrl(s.itemKey)" :alt="s.name">
                        <div class="flex flex-col min-w-0 flex-1">
                            <span class="text-[13px] truncate" x-text="s.name"></span>
                            <span class="text-[11px] text-slate-500" x-show="s.material" x-text="s.material"></span>
                        </div>
                        <span class="text-slate-400 font-bold tabular-nums" x-text="s.count"></span>
                    </div>
                </template>
                <div class="text-slate-500 italic text-sm text-center py-4" x-show="!filteredWarehouse.length">No stock.</div>
                <div class="text-slate-500 text-[12px] text-center py-2 cursor-pointer hover:text-blue-300" x-show="warehouseTruncated > 0" @click="openWarehouse()"
                     x-text="'+ ' + warehouseTruncated + ' more — open full list'"></div>
            </div>
        </aside>
    </div>

    <!-- Building modal -->
    <div class="fixed inset-0 z-50 grid place-items-center p-5 bg-black/70 backdrop-blur-sm"
         x-show="modal" @click.self="closeModal()" @keydown.escape.window="closeModal()" x-transition.opacity>
        <div class="w-[min(820px,96vw)] max-h-[88vh] overflow-auto rounded-2xl border border-slate-700 bg-slate-900 p-5 shadow-2xl" x-show="modal" x-transition>
            <template x-if="modal">
                <div>
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-3.5">
                            <img class="w-12 h-12 pixelated rounded-lg bg-black/25 border border-slate-700 p-1" loading="lazy" :src="buildingIconUrl(modal)" :alt="modal.name">
                            <div>
                                <h3 class="text-xl font-bold flex items-center gap-2.5 flex-wrap">
                                    <span x-text="modal.name"></span>
                                    <span class="ba" :class="badgeClass(actionOf(modal))" x-show="actionOf(modal)" x-text="actionOf(modal)"></span>
                                    <span class="bg-amber-500/15 text-amber-300 border border-amber-500/45 text-[9.5px] font-extrabold px-1.5 py-[3px] rounded uppercase" x-show="modal.kind === 'decoration'">Decoration</span>
                                </h3>
                                <div class="flex gap-3 text-slate-400 text-sm mt-1">
                                    <span x-show="workOrderTargetLevel(modal)" x-text="modal.level + ' → ' + workOrderTargetLevel(modal)"></span>
                                    <span class="text-slate-500 tabular-nums" x-text="modal.x + ', ' + modal.y + ', ' + modal.z"></span>
                                </div>
                            </div>
                        </div>
                        <button class="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700" @click="closeModal()">✕</button>
                    </div>

                    <div class="flex items-center gap-3.5 bg-slate-800/60 border border-slate-700 rounded-xl p-3.5 my-4" x-show="modal.beingBuilt">
                        <img class="w-11 h-11 pixelated rounded-lg bg-black/25 border border-slate-700 p-1" :src="'/textures/' + encodeURIComponent('minecolonies:blockhutbuilder') + '.png'" alt="">
                        <div class="flex-1">
                            <div class="progress big"><span :style="'width:' + buildingProgress(modal) + '%'"></span></div>
                            <div class="flex justify-between text-slate-400 text-[12.5px] mt-2">
                                <span x-show="builtBy(modal)">Being built by: <b class="text-blue-300" x-text="builtBy(modal)"></b></span>
                                <span x-text="buildingProgress(modal) + '%'"></span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-3">
                        <div class="flex items-center justify-between gap-3 flex-wrap mb-2.5">
                            <h4 class="text-[15px] font-semibold">Resource Table</h4>
                            <div class="flex items-center gap-2 bg-ink-950 border border-slate-700 rounded-lg px-2.5 text-slate-400" x-show="(modal.required || []).length">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                                <input type="search" class="bg-transparent outline-none py-1.5 text-[13px]" placeholder="Search" x-model="modalSearch">
                            </div>
                        </div>
                        <div class="border border-slate-700 rounded-xl overflow-hidden">
                            <table class="w-full text-[13.5px] border-collapse" x-show="modalResources().length">
                                <thead>
                                <tr class="text-slate-400 bg-white/[0.02]">
                                    <th class="text-left font-semibold px-3.5 py-2.5">Icon</th>
                                    <th class="text-left font-semibold px-3.5 py-2.5">Item Name</th>
                                    <th class="text-right font-semibold px-3.5 py-2.5">Needed</th>
                                    <th class="text-right font-semibold px-3.5 py-2.5">In Hut</th>
                                    <th class="text-right font-semibold px-3.5 py-2.5">Warehouse</th>
                                    <th class="text-right font-semibold px-3.5 py-2.5">Status</th>
                                </tr>
                                </thead>
                                <tbody>
                                <template x-for="r in modalResources()" :key="r.itemKey">
                                    <tr class="border-t border-slate-800 hover:bg-white/[0.02]" :class="'row-' + statusOf(r)">
                                        <td class="px-3.5 py-2.5"><img class="w-[22px] h-[22px] pixelated rounded bg-black/20 p-px" loading="lazy" :src="textureUrl(r.itemKey)" :alt="r.name"></td>
                                        <td class="px-3.5 py-2.5">
                                            <span x-text="r.name"></span>
                                            <span class="text-slate-500 text-[11.5px] ml-1.5" x-show="r.material" x-text="'(+ Domum: ' + r.material + ')'"></span>
                                        </td>
                                        <td class="px-3.5 py-2.5 text-right tabular-nums" x-text="r.needed"></td>
                                        <td class="px-3.5 py-2.5 text-right tabular-nums" x-text="r.inHut"></td>
                                        <td class="px-3.5 py-2.5 text-right tabular-nums" x-text="r.inWarehouse"></td>
                                        <td class="px-3.5 py-2.5 text-right"><span class="pill" :class="statusOf(r)" x-text="statusLabel(r)"></span></td>
                                    </tr>
                                </template>
                                </tbody>
                            </table>
                            <div class="text-slate-500 italic text-sm text-center py-4" x-show="!modalResources().length && (modal.required || []).length">No items match your search.</div>
                            <div class="text-slate-500 italic text-sm text-center py-4" x-show="!(modal.required || []).length">No pending requirements.</div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Warehouse modal -->
    <div class="fixed inset-0 z-50 grid place-items-center p-5 bg-black/70 backdrop-blur-sm"
         x-show="warehouseOpen" @click.self="closeWarehouse()" @keydown.escape.window="closeWarehouse()" x-transition.opacity>
        <div class="w-[min(820px,96vw)] max-h-[88vh] overflow-auto rounded-2xl border border-slate-700 bg-slate-900 p-5 shadow-2xl" x-show="warehouseOpen" x-transition>
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-xl font-bold">Warehouse Stock</h3>
                <button class="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700" @click="closeWarehouse()">✕</button>
            </div>
            <div class="flex items-center justify-between gap-3 flex-wrap mb-2.5">
                <div class="flex items-center gap-2 text-[13px] text-slate-400">
                    <span>Sort by</span>
                    <select class="field py-1.5 text-xs" x-model="whModalSort">
                        <option value="count">count</option>
                        <option value="alpha">alphabetically</option>
                    </select>
                </div>
                <div class="flex items-center gap-2 bg-ink-950 border border-slate-700 rounded-lg px-2.5 text-slate-400">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="search" class="bg-transparent outline-none py-1.5 text-[13px]" placeholder="Search" x-model="whModalSearch">
                </div>
            </div>
            <div class="border border-slate-700 rounded-xl overflow-hidden">
                <table class="w-full text-[13.5px] border-collapse">
                    <thead>
                    <tr class="text-slate-400 bg-white/[0.02]">
                        <th class="text-left font-semibold px-3.5 py-2.5">Icon</th>
                        <th class="text-left font-semibold px-3.5 py-2.5">Item Name</th>
                        <th class="text-left font-semibold px-3.5 py-2.5">Material</th>
                        <th class="text-right font-semibold px-3.5 py-2.5">Count</th>
                    </tr>
                    </thead>
                    <tbody>
                    <template x-for="s in warehouseModalList()" :key="s.itemKey">
                        <tr class="border-t border-slate-800 hover:bg-white/[0.02]">
                            <td class="px-3.5 py-2.5"><img class="w-[22px] h-[22px] pixelated rounded bg-black/20 p-px" loading="lazy" :src="textureUrl(s.itemKey)" :alt="s.name"></td>
                            <td class="px-3.5 py-2.5" x-text="s.name"></td>
                            <td class="px-3.5 py-2.5 text-slate-500" x-text="s.material || '—'"></td>
                            <td class="px-3.5 py-2.5 text-right tabular-nums" x-text="s.count"></td>
                        </tr>
                    </template>
                    </tbody>
                </table>
                <div class="text-slate-500 italic text-sm text-center py-4" x-show="!warehouseModalList().length">No stock to show.</div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
