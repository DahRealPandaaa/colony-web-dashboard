<div class="modal-backdrop" x-show="building" x-transition.opacity
     @click.self="closeBuilding()" @keydown.escape.window="closeBuilding()">
    <div class="modal-card" x-show="building" x-transition>
        <template x-if="building">
            <div>
                <div class="modal-head">
                    <div class="flex items-center gap-3.5 min-w-0">
                        <img class="w-12 h-12 pixelated rounded-lg bg-black/25 border border-line p-1 shrink-0"
                             loading="lazy" :src="buildingIcon(building)" :alt="building.name">
                        <div class="min-w-0">
                            <h3 class="text-[18px] font-bold tracking-tight flex items-center gap-2.5 flex-wrap">
                                <span x-text="building.name"></span>
                                <span class="ba" :class="badgeClass(actionOf(building))"
                                      x-show="actionOf(building)" x-text="actionOf(building)"></span>
                                <span class="ba b-repair" x-show="building.kind === 'decoration'">Decoration</span>
                            </h3>
                            <div class="flex gap-3 text-slate-500 text-[12.5px] mt-1 flex-wrap">
                                <span x-show="workOrderTargetLevel(building)" class="tabular-nums"
                                      x-text="'Level ' + building.level + ' → ' + workOrderTargetLevel(building)"></span>
                                <span x-show="!workOrderTargetLevel(building)" x-text="'Level ' + building.level"></span>
                                <span class="tabular-nums" x-text="building.x + ', ' + building.y + ', ' + building.z"></span>
                            </div>
                        </div>
                    </div>
                    <button class="btn-icon shrink-0" @click="closeBuilding()" aria-label="Close">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                    </button>
                </div>

                <div class="modal-body">
                    <div class="card flex items-center gap-3.5 mb-4" x-show="building.beingBuilt">
                        <img class="w-11 h-11 pixelated rounded-lg bg-black/25 border border-line p-1 shrink-0"
                             :src="textureUrl('minecolonies:blockhutbuilder')" alt="">
                        <div class="flex-1">
                            <div class="progress big !mt-0"><span :style="'width:' + buildingProgress(building) + '%'"></span></div>
                            <div class="flex justify-between text-[12.5px] mt-2">
                                <span class="text-slate-500" x-show="builtBy(building)">
                                    Being built by <b class="text-accent-soft" x-text="builtBy(building)"></b>
                                </span>
                                <b class="text-accent-soft tabular-nums" x-text="buildingProgress(building) + '%'"></b>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between gap-3 flex-wrap mb-3">
                        <div>
                            <h4 class="panel-title">Required resources</h4>
                            <p class="panel-sub">Missing items first</p>
                        </div>
                        <div class="searchbox" x-show="(building.required || []).length">
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
                            </svg>
                            <input type="search" placeholder="Search" x-model="buildingSearch">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                        <!-- Keyed by index: two required stacks can collapse to one item key. -->
                        <template x-for="(r, ri) in buildingResources()" :key="ri">
                            <div class="mc-tip flex items-center gap-3">
                                <img class="mc-icon" loading="lazy" :src="textureUrl(r.itemKey)" :alt="r.name">
                                <div class="flex-1 min-w-0">
                                    <div class="mc-name" x-text="r.name"></div>
                                    <div class="mc-line" x-show="r.craftedIn">Crafted in the <span class="mc-val" x-text="r.craftedIn"></span></div>
                                    <template x-for="(c, cx) in (r.components || [])" :key="cx">
                                        <div class="mc-line"><span x-text="c.label"></span>: <span class="mc-val" x-text="c.material"></span></div>
                                    </template>
                                    <div class="mc-line">
                                        Hut <span class="mc-val" x-text="r.inHut"></span> ·
                                        Warehouse <span class="mc-val" x-text="r.inWarehouse"></span>
                                    </div>
                                </div>
                                <div class="text-right shrink-0">
                                    <div class="mc-count" x-text="'x' + num(r.needed)"></div>
                                    <span class="pill mt-1.5" :class="statusOf(r)" x-text="statusLabel(r)"></span>
                                </div>
                            </div>
                        </template>
                    </div>

                    <p class="empty" x-show="!buildingResources().length && (building.required || []).length">
                        No items match your search.
                    </p>
                    <p class="empty" x-show="!(building.required || []).length">No pending requirements.</p>
                </div>
            </div>
        </template>
    </div>
</div>
