<template x-if="tab === 'map'">
    <div class="animate-fade-up flex flex-col gap-3.5">
        <div class="toolbar !mb-0">
            <span class="chip"><i class="w-2 h-2 rounded-full bg-[#60a5fa]"></i>Buildings</span>
            <span class="chip"><i class="w-2 h-2 rounded-full bg-[#38bdf8]"></i>Under construction</span>
            <span class="chip"><i class="w-2 h-2 rounded-full bg-[#fbbf24]"></i>Decorations</span>
            <span class="chip"><i class="w-2 h-2 rounded-full bg-[#34d399]"></i>Citizens</span>
            <span class="ml-auto text-[12px] text-slate-500">Hover a marker for details · north is up</span>
        </div>

        <!--
          Both bindings have to be imperative: ":viewBox" is lowercased by the HTML parser to
          ":viewbox" (which SVG ignores), and a <template x-for> inside <svg> is parsed as an
          SVG element rather than a real template, so Alpine skips it.
        -->
        <div class="panel p-3 h-[calc(100vh-15rem)] min-h-[380px]">
            <svg class="w-full h-full" preserveAspectRatio="xMidYMid meet"
                 x-effect="$el.setAttribute('viewBox', mapViewBox)">
                <g x-html="mapMarkers"></g>
            </svg>
        </div>
    </div>
</template>
