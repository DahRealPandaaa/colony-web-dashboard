<template x-if="tab === 'map'">
    <div class="animate-fade-up">
        <div class="toolbar">
            <label class="switch">
                <input type="checkbox" x-model="showBuildings"><span class="track"></span>
                <span class="switch-label">Buildings</span>
            </label>
            <label class="switch">
                <input type="checkbox" x-model="showCitizens"><span class="track"></span>
                <span class="switch-label">Citizens</span>
            </label>
            <label class="switch">
                <input type="checkbox" x-model="showLabels"><span class="track"></span>
                <span class="switch-label">Labels</span>
            </label>

            <span class="chip chip-btn" role="button" tabindex="0"
                  @click="fitMap($refs.stage)" @keydown.enter="fitMap($refs.stage)">Fit</span>
            <span class="chip chip-btn" role="button" tabindex="0"
                  @click="centreMap($refs.stage)" @keydown.enter="centreMap($refs.stage)">Town hall</span>

            <span class="chip" x-show="map?.available"
                  :class="mappedPct >= 100 ? 'good' : ''"
                  :title="map ? (map.chunksMapped + ' of ' + map.chunksTotal + ' chunks drawn') : ''"
                  x-text="mappedPct >= 100 ? 'Fully mapped' : ('Mapping ' + mappedPct + '%')"></span>

            <span class="chip ml-auto tabular-nums"
                  x-text="hoverX === null ? ('Zoom ' + Math.round(zoom * 100) + '%') : ('X ' + hoverX + ' · Z ' + hoverZ)"></span>
        </div>

        <div class="map-frame" x-ref="stage"
             :class="dragging ? 'grabbing' : ''"
             @wheel.prevent="onMapWheel($event, $refs.stage)"
             @pointerdown="onMapDown($event)"
             @pointermove="onMapMove($event, $refs.stage)"
             @pointerup="onMapUp()"
             @pointerleave="onMapLeave()">

            <div class="map-world" :style="mapTransform" x-show="mapReady">
                <img class="map-terrain" :src="mapImageUrl" alt="Colony surface map"
                     draggable="false" @load="maybeFitMap($refs.stage)">

                <!-- The town hall, i.e. what MineColonies calls the colony centre. -->
                <span class="map-centre" x-show="map"
                      :style="map ? markerStyle(map.centerX, map.centerZ, 46) : 'display:none'"
                      :title="map ? ('Colony centre (' + map.centerX + ', ' + map.centerZ + ')') : ''"></span>

                <template x-for="c in mapCitizens" :key="'c' + c.id">
                    <button class="map-dot" :class="citizenDotClass(c)"
                            :style="citizenMarkerStyle(c)" :title="citizenTitle(c)"
                            @click.stop="dragMoved || openCitizen(c)"></button>
                </template>

                <template x-for="b in mapBuildings" :key="'b' + b.id">
                    <button class="map-pin" :class="b.beingBuilt ? 'building' : ''"
                            :style="buildingMarkerStyle(b)" :title="buildingTitle(b)"
                            @click.stop="dragMoved || openBuilding(b)">
                        <img :src="buildingArt(b) || buildingIcon(b)" :alt="b.name" draggable="false"
                             @error="buildingIconFallback($el, b)">
                        <span class="map-pin-label" x-show="showLabels" x-text="b.name"></span>
                    </button>
                </template>
            </div>

            <!-- Everything below sits above the world layer and does not move with it. -->
            <div class="map-note" x-show="map && map.available && !mapReady">
                <p class="empty-title">Drawing the colony map…</p>
                <p class="mt-1">The server maps a few chunks at a time, closest to the town hall first.</p>
            </div>

            <div class="map-note" x-show="map && !map.available">
                <p class="empty-title">No map for this colony.</p>
                <p class="mt-1" x-text="map?.unavailableReason"></p>
            </div>

            <div class="map-legend" x-show="mapReady">
                <span class="map-key"><i class="map-swatch centre"></i>Town hall</span>
                <span class="map-key"><i class="map-swatch build"></i>Being built</span>
                <span class="map-key"><i class="map-swatch worker"></i>Worker</span>
                <span class="map-key"><i class="map-swatch idle"></i>Unemployed</span>
                <span class="map-key"><i class="map-swatch child"></i>Child</span>
                <span class="map-key"><i class="map-swatch asleep"></i>Not loaded</span>
            </div>
        </div>

        <p class="mt-3 text-[12.5px] text-slate-400">
            Drag to pan, scroll to zoom. The map is drawn from chunks the server has loaded, so
            areas nobody has visited stay blank until they are.
        </p>
    </div>
</template>
