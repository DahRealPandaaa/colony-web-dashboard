<template x-if="tab === 'research'">
    <div class="animate-fade-up">
        <div class="empty" x-show="!research">Loading research…</div>
        <div class="empty" x-show="research && !research.available">
            <p class="empty-title">No research tree available.</p>
            <p class="mt-1">Build a university, or MineColonies exposed nothing to read.</p>
        </div>

        <template x-if="research && research.available">
            <div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                    <div class="tile">
                        <div class="tile-label">Completed</div>
                        <div class="tile-value text-emerald-300" x-text="research.completed"></div>
                        <div class="meter done mt-2"><span :style="'width:' + pct(research.completed, research.total) + '%'"></span></div>
                    </div>
                    <div class="tile">
                        <div class="tile-label">In progress</div>
                        <div class="tile-value text-accent-soft" x-text="research.inProgress"></div>
                        <div class="tile-sub" x-text="research.total + ' researches total'"></div>
                    </div>
                    <div class="tile">
                        <div class="tile-label">Branches</div>
                        <div class="tile-value" x-text="research.branches.length"></div>
                    </div>
                    <div class="tile">
                        <div class="tile-label">Remaining</div>
                        <div class="tile-value" x-text="research.total - research.completed"></div>
                    </div>
                </div>

                <!-- Anything the university is actually working on right now. -->
                <section class="panel mb-4" x-show="researchInProgress.length">
                    <div class="panel-head">
                        <div>
                            <h2 class="panel-title">Underway</h2>
                            <p class="panel-sub">Across every branch</p>
                        </div>
                    </div>
                    <div class="panel-body grid grid-auto-wide gap-2.5">
                        <template x-for="r in researchInProgress" :key="r.id">
                            <div class="card card-active !p-3">
                                <div class="font-semibold text-[13.5px]" x-text="r.name"></div>
                                <div class="text-[11.5px] text-slate-500" x-text="r.branch + ' · tier ' + r.depth"></div>
                                <div class="progress"><span :style="'width:' + pct(r.progress, r.maxProgress) + '%'"></span></div>
                                <div class="text-[11.5px] text-accent-soft font-bold tabular-nums mt-1.5"
                                     x-text="pct(r.progress, r.maxProgress) + '%'"></div>
                            </div>
                        </template>
                    </div>
                </section>

                <div class="toolbar">
                    <button class="chip chip-btn" :class="researchBranch === '' ? 'on' : ''" @click="researchBranch = ''">
                        All branches
                    </button>
                    <template x-for="b in research.branches" :key="b.id">
                        <button class="chip chip-btn" :class="researchBranch === b.id ? 'on' : ''" @click="researchBranch = b.id">
                            <span x-text="b.name"></span>
                            <b class="tabular-nums" x-text="b.completed + '/' + b.total"></b>
                        </button>
                    </template>
                    <select class="field py-1.5 ml-auto" x-model="researchFilter" aria-label="Filter research">
                        <option value="all">Everything</option>
                        <option value="IN_PROGRESS">In progress</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="NOT_STARTED">Not started</option>
                    </select>
                </div>

                <div class="space-y-4">
                    <template x-for="b in researchBranches" :key="b.id">
                        <section class="panel">
                            <div class="panel-head">
                                <div>
                                    <h2 class="panel-title" x-text="b.name"></h2>
                                    <p class="panel-sub"
                                       x-text="b.completed + ' completed · ' + b.inProgress + ' in progress · ' + b.total + ' total'"></p>
                                </div>
                                <div class="w-28 shrink-0 pt-2">
                                    <div class="meter done"><span :style="'width:' + pct(b.completed, b.total) + '%'"></span></div>
                                </div>
                            </div>
                            <div class="panel-body grid grid-auto-wide gap-2.5">
                                <template x-for="r in researchIn(b)" :key="r.id">
                                    <div class="card !p-3"
                                         :class="r.state === 'IN_PROGRESS' ? 'card-active'
                                                 : (r.state === 'COMPLETED' ? 'border-emerald-500/25' : 'opacity-80')">
                                        <div class="flex items-start justify-between gap-2">
                                            <span class="font-semibold text-[13.5px]" x-text="r.name"></span>
                                            <span class="state shrink-0" :class="stateClass(r.state)" x-text="stateLabel(r.state)"></span>
                                        </div>
                                        <div class="text-[11.5px] text-slate-600 mt-0.5" x-text="'Tier ' + r.depth"></div>

                                        <template x-if="r.state === 'IN_PROGRESS' && r.maxProgress">
                                            <div class="mt-2">
                                                <div class="progress"><span :style="'width:' + pct(r.progress, r.maxProgress) + '%'"></span></div>
                                                <div class="text-[11px] text-accent-soft font-bold tabular-nums mt-1"
                                                     x-text="pct(r.progress, r.maxProgress) + '%'"></div>
                                            </div>
                                        </template>

                                        <ul class="mt-2 space-y-0.5" x-show="r.effects.length">
                                            <template x-for="(e, ei) in r.effects" :key="ei">
                                                <li class="text-[11.5px] text-emerald-300/90 truncate" x-text="'+ ' + e"></li>
                                            </template>
                                        </ul>

                                        <div class="flex items-center gap-2 mt-2 flex-wrap" x-show="r.cost.length">
                                            <template x-for="(c, ci) in r.cost" :key="ci">
                                                <span class="inline-flex items-center gap-1 text-[11px] text-slate-500" :title="c.name">
                                                    <img class="w-4 h-4 pixelated" loading="lazy" :src="textureUrl(c.itemKey)" :alt="c.name">
                                                    <b class="tabular-nums" x-text="c.count"></b>
                                                </span>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                                <p class="empty" x-show="!researchIn(b).length">Nothing here matches the filter.</p>
                            </div>
                        </section>
                    </template>
                </div>
            </div>
        </template>
    </div>
</template>
