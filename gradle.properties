org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Reuse task outputs across builds. Locally this skips recompiling untouched
# sources after a branch switch; in CI the cache directory is restored between
# runs, so only what actually changed is rebuilt.
org.gradle.caching=true

# ---------------------------------------------------------------------------
# Mod identity. Everything here is the same for every supported Minecraft
# version; anything that differs per version lives in that version's own
# versions/<mc>-<loader>/gradle.properties instead.
# ---------------------------------------------------------------------------

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=colonyweb
# The human-readable display name for the mod.
mod_name=ColonyWeb
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
# Only seeds the very first release; after that the Build & Release workflow
# derives each version from the newest v* tag and passes it as -Pmod_version.
# One, two and three component versions are all valid, so 2, 1.1 and 1.1.0-BETA
# are equally releasable.
mod_version=0.1.0-BETA
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=DahRealPanda.plugins
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=DahRealPanda
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
# Non-ASCII must be written as a \\uXXXX escape: Gradle reads this file with java.util.Properties,
# which decodes it as ISO-8859-1, so a literal em dash here reaches mods.toml as mojibake.
mod_description=ColonyWeb \u2014 a live, authenticated web dashboard for your MineColonies colonies: builders, work orders, citizens, research, defence and warehouse stock.
