// Everything every versions/<mc>-<loader> project shares. Applied from each of their
// build.gradle files, right after their plugins block:
//
//     apply from: "$rootDir/gradle/mod-common.gradle"
//
// so that a new Minecraft version only has to declare what actually differs.

// Gradle reads gradle.properties from the root project and the Gradle user home, never from a
// subproject, so each version project's own properties file is loaded here by hand. Properties
// that already exist win, which keeps the root file and any -P override authoritative — that is
// what lets CI pass one -Pmod_version to every target at once.
def versionProperties = new Properties()
def versionPropertiesFile = file('gradle.properties')
if (!versionPropertiesFile.exists()) {
    throw new GradleException("${project.path} has no gradle.properties; it must declare at least " +
            "minecraft_version, loader, java_version and pack_format")
}
// Read as UTF-8 rather than via load(InputStream), which would decode ISO-8859-1.
versionPropertiesFile.withReader('UTF-8') { versionProperties.load(it) }
versionProperties.each { key, value ->
    if (!project.hasProperty(key as String)) {
        project.ext[key as String] = value
    }
}

group = mod_group_id
version = mod_version

base {
    // colonyweb-1.20.1-forge-1.4.0.jar. The Minecraft version and loader are part of the file
    // name because one release carries one jar per supported version, all in the same place.
    archivesName = "${mod_id}-${minecraft_version}-${loader}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

sourceSets.main.java.srcDir "$rootDir/common/src/main/java"
sourceSets.main.kotlin.srcDir "$rootDir/common/src/main/kotlin"
// Only the built dashboard ships. Everything webroot needs in order to *produce* that dashboard —
// the TypeScript sources, the dev mock server, the npm and Vite config — stays out of the jar, as
// do npm's install and cache directories, which are untracked and so would otherwise make the jar's
// contents depend on what the developer last ran rather than on the commit being built.
// `js/app.js` and `style.css` are generated by buildFrontend below.
sourceSets.main.resources {
    srcDir "$rootDir/common/src/main/resources"
    exclude 'webroot/node_modules/**', 'webroot/.vite/**', 'webroot/src/**',
            'webroot/mock-server/**', 'webroot/package*.json', 'webroot/tsconfig*.json',
            'webroot/vite.config.ts', 'webroot/.gitignore', 'webroot/old-style.css'
}

// Expand ${...} placeholders in the mod metadata. Every property this version project declares
// is available, so a metadata file can reference forge_version_range or neoforge_version_range
// without this script knowing which loader it is dealing with. A missing property is an error.
tasks.named('processResources', ProcessResources).configure {
    // Without this the filtered files are read and written in the platform default charset, so a
    // build on a Windows machine ships a mods.toml whose description is mojibake.
    filteringCharset = 'UTF-8'

    var replaceProperties = [:]
    versionProperties.keySet().each { key ->
        replaceProperties[key as String] = project.property(key as String)
    }
    ['mod_id', 'mod_name', 'mod_license', 'mod_version', 'mod_authors', 'mod_description'].each { key ->
        replaceProperties[key] = project.property(key)
    }

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// ---- Frontend ----
// The dashboard is a Vite/TypeScript app, so the jar cannot be assembled without building it first.
// That makes Node a build requirement for the mod; the GitHub runners ship it, and a contributor
// touching only Kotlin still needs it because processResources depends on the built output.

// npm and npx are batch files on Windows and are not executable without the extension.
def npmCmd() {
    return System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win') ? 'npm.cmd' : 'npm'
}
def npxCmd() {
    return System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win') ? 'npx.cmd' : 'npx'
}

def frontendDir = file("$rootDir/common/src/main/resources/webroot")

// This script is applied once per version project, but there is only one dashboard and it lives in
// the shared common/ tree. Registering the build per version would point several Vite runs at the
// same output directory, which Gradle rejects as overlapping task outputs as soon as two targets
// are built in one invocation (CI builds one version per job, so it would only break locally).
// Registering on the root project instead means one build, reused by every version.
if (!rootProject.tasks.names.contains('buildFrontend')) {
    // `npm install`, not `npm ci`: package-lock.json is not committed, and `npm ci` exits with an
    // error rather than resolving anything when there is no lockfile to install from. The
    // trade-off is that the ranges in package.json are re-resolved on every clean build, so two
    // builds of the same commit can end up on different transitive versions.
    rootProject.tasks.register('npmInstallFrontend', Exec) {
        workingDir = frontendDir
        commandLine npmCmd(), 'install', '--no-audit', '--no-fund'
        inputs.file("$frontendDir/package.json")
        outputs.dir("$frontendDir/node_modules")
    }

    rootProject.tasks.register('buildFrontend', Exec) {
        dependsOn rootProject.tasks.named('npmInstallFrontend')
        workingDir = frontendDir
        commandLine npxCmd(), 'vite', 'build'
        inputs.dir("$frontendDir/src")
        inputs.file("$frontendDir/tsconfig.json")
        inputs.file("$frontendDir/vite.config.ts")
        // Tailwind scans index.html for classes, so its markup is a build input too.
        inputs.file("$frontendDir/index.html")
        outputs.file("$frontendDir/js/app.js")
        outputs.file("$frontendDir/style.css")
        // Always rebuild — Vite is fast and stale frontend artifacts are a persistent source of bugs.
        outputs.upToDateWhen { false }
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn rootProject.tasks.named('buildFrontend')
}

// Lets the mod read its own coordinates at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : mod_name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
}


repositories {
    mavenCentral()
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    // LDTTeam maven hosts MineColonies and Domum Ornamentum artifacts. They are runtime-only
    // on every target: ColonyWeb integrates through reflection, so they never reach the compile
    // classpath and are never bundled into the published jar.
    maven {
        name = 'LDTTeam - Modding'
        url = 'https://ldtteam.jfrog.io/artifactory/modding/'
    }
}
