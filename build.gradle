plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.0.20' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.0.20' apply false
}

// ColonyWeb is built once per supported Minecraft version.
//
//   common/                      every source file that compiles against all of them
//   versions/1.20.1-forge/       Forge 47.x, JDK 17   — its own build.gradle + gradle.properties
//   versions/1.21.1-neoforge/    NeoForge 21.1.x, JDK 21
//   gradle/mod-common.gradle     the configuration every version project shares
//
// This root project deliberately applies no plugins and produces no artifact: ForgeGradle and
// ModDevGradle each want their own JDK, so nothing that touches Minecraft belongs here.
//
//   ./gradlew build                                 builds every supported version
//   ./gradlew build -PmcVersions=1.21.1-neoforge    builds one (see settings.gradle)
//   ./gradlew :versions:1.20.1-forge:runServer      runs a dev server for one
//
// Adding a Minecraft version: copy the closest versions/ directory, adjust its
// gradle.properties, add a line to the matrix in .github/workflows/pr-build.yml
// and build.yml. Nothing outside those places needs to know about it.

tasks.register('listVersions') {
    group = 'help'
    description = 'Lists the Minecraft versions this checkout can build.'
    def targets = file('versions').listFiles({ f -> new File(f, 'build.gradle').exists() } as FileFilter)
            *.name.sort()
    doLast {
        println targets.join('\n')
    }
}
