name: Build & Release

# Runs on every push to main, which includes merged pull requests. One release carries one jar per
# supported Minecraft version.
#
# Two version lineages, deliberately kept apart:
#   CI builds  a single, ever-increasing build number — v4, v5, v6 — published as pre-releases.
#              Every push to main takes the next one; nothing about the branch or the pull
#              request changes it.
#   Releases   a semver x.x.x, spelled out by hand in the "version" input below. This is the
#              only way to cut a full release, so a merged pull request can never do it by
#              accident.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Semver to cut a full release with: three components and an optional
          suffix, so "1.4.0" and "1.4.0-RC1" are both valid. Leave empty to
          publish the next CI build number as a pre-release, exactly as a push
          to main does.
        type: string
        required: false
        default: ''

permissions:
  contents: write

# A release must never be cancelled halfway, or a tag ends up without a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Which Minecraft versions exist is a property of the versions/ directory, not of this file, so
  # adding one never means editing a workflow.
  targets:
    name: Resolve build targets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Discover build targets
        id: targets
        uses: ./.github/actions/build-targets

  # Version resolution needs git history and the GitHub API, but no JDK and no Minecraft, so it
  # runs once and in parallel with nothing else — every target ships under the same version.
  version:
    name: Resolve release version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so the version steps can see every existing v* tag.
          fetch-depth: 0

      # An empty "version" input — every push, and a manual run that leaves it
      # blank — takes the next CI build number. A filled-in one cuts the semver
      # release it names. The two lineages never touch: build numbers are counted
      # from the plain v<n> tags alone, so cutting v1.4.0 does not move the
      # counter, and reaching build v9 does not shift the next release's numbers.
      - name: Resolve version
        id: version
        env:
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail

          override="${OVERRIDE// /}"
          if [[ -n "$override" ]]; then
            if [[ ! "$override" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
              echo "::error::version '$override' must be three numeric components with an optional -suffix, such as 1.4.0"
              exit 1
            fi
            next="$override"
            echo "Cutting release v${next}"
          else
            # Tags are the source of truth: the release commit is never pushed back,
            # so nothing has to be committed to move the counter along. The sort is
            # numeric because v10 has to outrank v9.
            last=$(git tag --list 'v*' | grep -E '^v[0-9]+$' | cut -c2- | sort -n | tail -n 1 || true)
            next=$(( ${last:-0} + 1 ))
            echo "Build ${next}, after ${last:+v}${last:-no previous build}"
          fi

          if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then
            echo "::error::tag v${next} already exists; pick a different version"
            exit 1
          fi

          # A bare x.x.x is the only thing published as a full release, which
          # leaves every build number and every suffixed semver a pre-release.
          if [[ "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          else
            prerelease=true
          fi

          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Publishing v${next} (prerelease=${prerelease})"

  build:
    name: Build ${{ matrix.version }}
    needs: [targets, version]
    runs-on: ubuntu-latest
    # A cold decompile of Minecraft takes ~20 minutes; anything past an hour is hung rather
    # than slow.
    timeout-minutes: 60
    strategy:
      # A release with a jar missing is worse than a release that fails outright, but seeing
      # which targets broke is worth more than stopping at the first one.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # cache-read-only is false here: main is the only branch allowed to
      # populate the shared caches that every pull request build reads.
      - name: Set up build environment
        id: build-env
        uses: ./.github/actions/gradle-build-env
        with:
          version: ${{ matrix.version }}
          java-version: ${{ matrix.java }}
          toolchain-cache-path: ${{ matrix.cache }}
          cache-read-only: 'false'

      # The version is passed in rather than written into gradle.properties: one -P override
      # reaches every target, and the release commit is never pushed back anyway.
      #
      # -PmcVersions keeps Gradle from even configuring the other targets, whose toolchain
      # plugins want a different JDK from the one this job installed.
      - name: Build
        run: >-
          ./gradlew :versions:${{ matrix.version }}:build
          -PmcVersions=${{ matrix.version }}
          -Pmod_version=${{ needs.version.outputs.version }}
          --no-daemon --stacktrace

      # Only main writes this one, and only when the restore missed. The path
      # must stay in step with the restore in .github/actions/gradle-build-env.
      - name: Save toolchain cache
        if: steps.build-env.outputs.toolchain-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.cache }}
          key: ${{ steps.build-env.outputs.toolchain-cache-key }}

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: jars-${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/*.jar
          if-no-files-found: error

  # One tag, one release, every version's jar attached to it.
  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Collect every version's jar
        uses: actions/download-artifact@v7
        with:
          pattern: jars-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          # An empty dist would otherwise publish a release with nothing to download.
          count=$(find dist -name '*.jar' | wc -l)
          if (( count == 0 )); then
            echo "::error::no jars were built"
            exit 1
          fi
          echo "Attaching ${count} jar(s):"
          find dist -name '*.jar' -printf '  %f\n'

          flags=()
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "v${VERSION}" dist/*.jar \
            --title "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --generate-notes \
            "${flags[@]}"
