name: Build & Release

# Runs on every push to main, which includes merged pull requests.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

# A release must never be cancelled halfway, or a tag ends up without a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Build and publish mod jar
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      # Forge 1.20.1 requires JDK 17; the Gradle cache keeps ForgeGradle from
      # re-downloading and re-decompiling Minecraft on every run.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Which part of the version to raise, highest precedence first:
      #   1. a ticked "- [x] major|minor|patch" box in the merged PR description
      #   2. the PR branch prefix — major/ and breaking/ raise major, feat/, feature/
      #      and minor/ raise minor, everything else raises patch
      # Direct pushes and manual runs have no pull request, so they raise patch.
      - name: Resolve bump level
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Works for merge, squash and rebase merges alike: ask which PR this commit came from.
          pulls="$RUNNER_TEMP/pulls.json"
          if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" > "$pulls"; then
            echo "::warning::Unable to resolve PR for ${GITHUB_SHA}; defaulting to patch bump"
            echo '[]' > "$pulls"
          fi
          branch=$(jq -r '.[0].head.ref // ""' "$pulls")
          body=$(jq -r '.[0].body // ""' "$pulls")

          # Levels named on ticked checkbox lines. Unticked "- [ ]" boxes are ignored.
          checked=$(printf '%s' "$body" \
            | grep -iE '^[[:space:]]*[-*][[:space:]]*\[[[:space:]]*x[[:space:]]*\]' \
            | grep -ioE '\b(major|minor|patch)\b' \
            | tr '[:upper:]' '[:lower:]' || true)

          # If several boxes are ticked, the widest bump wins.
          level=""
          if grep -qx major <<<"$checked"; then
            level=major
          elif grep -qx minor <<<"$checked"; then
            level=minor
          elif grep -qx patch <<<"$checked"; then
            level=patch
          fi

          if [[ -n "$level" ]]; then
            reason="ticked box in the pull request description"
          else
            prefix="${branch%%/*}"
            case "${prefix,,}" in
              major|breaking)     level=major ;;
              feat|feature|minor) level=minor ;;
              *)                  level=patch ;;
            esac
            reason="branch '${branch:-none}'"
          fi

          echo "level=${level}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${level}, decided by ${reason}"

      # Keeps any suffix, so a patch bump turns 1.0.0-BETA into 1.0.1-BETA.
      - name: Bump version
        id: version
        env:
          LEVEL: ${{ steps.bump.outputs.level }}
        run: |
          set -euo pipefail
          current=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          if [[ ! "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(.*)$ ]]; then
            echo "::error::mod_version '$current' is not MAJOR.MINOR.PATCH[suffix]"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          suffix="${BASH_REMATCH[4]}"

          case "$LEVEL" in
            major) next="$((major + 1)).0.0${suffix}" ;;
            minor) next="${major}.$((minor + 1)).0${suffix}" ;;
            patch) next="${major}.${minor}.$((patch + 1))${suffix}" ;;
            *)     echo "::error::unknown bump level '$LEVEL'"; exit 1 ;;
          esac

          sed -i -E "s|^mod_version=.*|mod_version=${next}|" gradle.properties
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${next}, was ${current}"

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      # Recorded only once the build passed, so a failed run leaves main untouched.
      - name: Commit and tag version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          RETRY_DELAY_MULTIPLIER=2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle.properties
          git commit -m "chore: release v${VERSION} [skip ci]"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              echo "::error::Unable to rebase release commit onto latest main. Resolve conflicts and rerun."
              git rebase --abort || true
              exit 1
            fi

            if git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; then
              git tag -d "v${VERSION}"
            fi
            git tag "v${VERSION}"
            if git push --atomic origin HEAD:main "refs/tags/v${VERSION}"; then
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Unable to push release commit after 3 attempts."
              exit 1
            fi

            sleep $((attempt * RETRY_DELAY_MULTIPLIER))
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" build/libs/*.jar \
            --title "v${VERSION}" \
            --generate-notes

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: colonyweb-jar
          path: build/libs/*.jar
          if-no-files-found: error
