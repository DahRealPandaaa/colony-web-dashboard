name: Screenshot Width

# The CurseForge project description reuses docs/screenshots/, and CurseForge does not scale
# oversized images down — it clips them. GitHub does scale, so a too-wide screenshot looks
# perfect in review and broken on the mod page. This catches that before it ships.
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/screenshots/**'

permissions:
  contents: read

concurrency:
  group: screenshot-width-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check screenshots are at most 850px wide
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # identify ships with the runner image, so there is nothing to install.
      - name: Measure
        run: |
          max=850
          status=0
          shopt -s nullglob
          for file in docs/screenshots/*.png docs/screenshots/*.jpg docs/screenshots/*.jpeg; do
            width=$(identify -format '%w' "$file[0]")
            if [ "$width" -gt "$max" ]; then
              echo "::error file=$file::${width}px wide, limit is ${max}px — CurseForge will clip this. Resize with: magick '$file' -resize ${max}x\> '$file'"
              status=1
            else
              echo "ok: $file (${width}px)"
            fi
          done
          exit $status
