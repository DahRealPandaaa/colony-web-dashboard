name: PR Build

# Verifies that a pull request still compiles before it can be merged into main.
on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

# Superseded runs are useless, so drop them when new commits arrive.
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    # A cold ForgeGradle run decompiles Minecraft and takes ~20 minutes; anything
    # past an hour is hung rather than slow.
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # cache-read-only: pull requests read the caches main populates but never
      # write per-branch copies of a 1.5 GB ForgeGradle cache back.
      - name: Set up build environment
        uses: ./.github/actions/gradle-build-env
        with:
          cache-read-only: 'true'

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      # Lets a reviewer drop the jar straight into a test instance.
      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: colonyweb-jar-pr-${{ github.event.pull_request.number }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
