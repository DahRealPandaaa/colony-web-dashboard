name: PR Build

# Verifies that a pull request still compiles before it can be merged into main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded runs are useless, so drop them when new commits arrive.
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Forge 1.20.1 requires JDK 17; the Gradle cache keeps ForgeGradle from
      # re-downloading and re-decompiling Minecraft on every run.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
