name: Gradle build environment
description: >-
  The JDK, wrapper validation and every cache one Minecraft target's build needs.
  Shared by the PR build and the release build so the two can never drift apart.

inputs:
  version:
    description: The versions/ directory being built, e.g. 1.20.1-forge. Scopes the caches to it.
    required: true
  java-version:
    description: >-
      JDK for this target — 17 for Forge 1.20.1, 21 for NeoForge 1.21.1. Comes from the target's
      own java_version property via .github/actions/build-targets, so it always matches the
      toolchain the Gradle build asks for.
    required: true
  toolchain-cache-path:
    description: >-
      Where this target's loader toolchain keeps its decompiled Minecraft. ForgeGradle uses
      ~/.gradle/caches/forge_gradle (~1.5 GB); ModDevGradle uses ~/.gradle/caches/neoformruntime
      (~300 MB). Both are regenerated at a cost of many minutes, and neither is covered by
      setup-gradle.
    required: true
  cache-read-only:
    description: >-
      When true the caches are restored but never written back. Pull request builds should leave
      this at true so only main populates the caches.
    required: false
    default: 'true'

outputs:
  toolchain-cache-key:
    description: Key the toolchain cache was looked up under, for a later cache/save step.
    value: ${{ steps.toolchain-key.outputs.key }}
  toolchain-cache-hit:
    description: Set when the toolchain cache was restored from an exact key match.
    value: ${{ steps.toolchain-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # gradle/actions stays on v5 on purpose. v6 moved the caching code into
    # gradle-actions-caching, a proprietary component governed by Gradle's
    # commercial Terms of Use rather than the MIT licence, and dropped
    # configuration cache support. v5 is the newest MIT release and already
    # runs on Node 24.
    #
    # A tampered wrapper jar would run arbitrary code with the release token, so
    # this stays ahead of every step that can invoke Gradle.
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v5

    # One JDK is enough per job: every build command passes -PmcVersions, so only this target's
    # project is configured and only its toolchain is requested. Deliberately no `cache: gradle`
    # here — setup-gradle below caches the same directories with far better keys.
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    # The key tracks everything that can invalidate the decompiled Minecraft: the loader and
    # mapping versions and the mod dependency versions all live in the target's gradle.properties,
    # its repository and dependency declarations in its build.gradle, and the shared conventions in
    # gradle/mod-common.gradle. Scoping the key by target means a 1.21.1 bump cannot evict the
    # 1.20.1 cache. The restore-keys fall back to the newest previous cache for the same target, so
    # a version bump re-uses most of it instead of starting from scratch.
    - name: Compute toolchain cache key
      id: toolchain-key
      shell: bash
      run: |
        echo "key=mcbuild-${{ inputs.version }}-${{ runner.os }}-${{ hashFiles(
          'gradle.properties',
          'settings.gradle',
          'gradle/mod-common.gradle',
          'gradle/wrapper/gradle-wrapper.properties',
          format('versions/{0}/gradle.properties', inputs.version),
          format('versions/{0}/build.gradle', inputs.version)) }}" >> "$GITHUB_OUTPUT"

    - name: Restore toolchain cache
      id: toolchain-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.toolchain-cache-path }}
        key: ${{ steps.toolchain-key.outputs.key }}
        restore-keys: |
          mcbuild-${{ inputs.version }}-${{ runner.os }}-

    # Dependencies, instrumented jars, wrapper distributions and the local
    # Gradle build cache. cache-read-only keeps pull requests from filling the
    # repository's 10 GB cache budget with per-branch copies.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: ${{ inputs.cache-read-only }}

    - name: Make Gradle wrapper executable
      shell: bash
      run: chmod +x ./gradlew
