name: Gradle build environment
description: >-
  JDK 17, wrapper validation and every cache a ColonyWeb build needs.
  Shared by the PR build and the release build so the two can never drift apart.

inputs:
  cache-read-only:
    description: >-
      When true the caches are restored but never written back. Pull request
      builds should leave this at true so only main populates the caches.
    required: false
    default: 'true'

outputs:
  forge-cache-key:
    description: Key the ForgeGradle cache was looked up under, for a later cache/save step.
    value: ${{ steps.forge-key.outputs.key }}
  forge-cache-hit:
    description: Set when the ForgeGradle cache was restored from an exact key match.
    value: ${{ steps.forge-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # A tampered wrapper jar would run arbitrary code with the release token, so
    # this stays ahead of every step that can invoke Gradle.
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    # Forge 1.20.1 requires JDK 17. Deliberately no `cache: gradle` here:
    # setup-gradle below caches the same directories with far better keys.
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # ForgeGradle keeps its decompiled Minecraft, MCP runtime and deobfuscated
    # mod dependencies in ~/.gradle/caches/forge_gradle — roughly 1.5 GB that
    # costs upwards of ten minutes to regenerate, and the single biggest win
    # available to this pipeline. setup-gradle does not cover that directory
    # (it caches modules-2, jars-*, build-cache-1 and the wrapper dists), so it
    # gets its own entry here.
    #
    # The key tracks everything that can invalidate those artifacts: the
    # Minecraft/Forge/mapping versions and the mod dependency versions all live
    # in gradle.properties, and the repository and dependency declarations live
    # in build.gradle. The restore-keys fall back to the newest previous cache
    # so a version bump re-uses most of it instead of starting from scratch.
    - name: Compute ForgeGradle cache key
      id: forge-key
      shell: bash
      run: |
        echo "key=forge-gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}" >> "$GITHUB_OUTPUT"

    - name: Restore ForgeGradle cache
      id: forge-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.gradle/caches/forge_gradle
        key: ${{ steps.forge-key.outputs.key }}
        restore-keys: |
          forge-gradle-${{ runner.os }}-

    # Dependencies, instrumented jars, wrapper distributions and the local
    # Gradle build cache. cache-read-only keeps pull requests from filling the
    # repository's 10 GB cache budget with per-branch copies.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ inputs.cache-read-only }}

    - name: Make Gradle wrapper executable
      shell: bash
      run: chmod +x ./gradlew
