plugins {
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Identity, source sets, resource templating and the LDTTeam repository.
apply from: "$rootDir/gradle/mod-common.gradle"

import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = java_version as int
    kotlinOptions.freeCompilerArgs += ['-Xjvm-default=all']
}

// Libraries the embedded web server needs at runtime. ModDevGradle does not put
// implementation deps on the game classpath, so JarJar nests them and the runs block
// puts them on the dev classpath. kotlin/serialization/coroutines are excluded (KFF
// 5.8.0 provides them); slf4j-api is included for Java 21 module-path visibility.
configurations {
    bundledLibs {
        canBeConsumed = false
        canBeResolved = true
        exclude group: 'org.jetbrains.kotlin'
        exclude group: 'org.jetbrains.kotlinx'
    }
}

configurations.jarJar.extendsFrom configurations.bundledLibs

// MineColonies and its mandatory support mods, for runClient/runServer only. Copied into
// the mods folder because NeoForge discovers mods by scanning that directory, not the classpath.
configurations {
    devMods {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.20'

    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    bundledLibs 'org.nanohttpd:nanohttpd:2.3.1'
    bundledLibs 'org.slf4j:slf4j-api:2.0.9'

    devMods("com.ldtteam:minecolonies:${minecolonies_version}") { transitive = false }
    devMods("com.ldtteam:structurize:${structurize_version}") { transitive = false }
    devMods("com.ldtteam:blockui:${blockui_version}") { transitive = false }
    devMods("com.ldtteam:multipiston:${multipiston_version}") { transitive = false }
    devMods("com.ldtteam:domum-ornamentum:${domum_version}") { transitive = false }

    devMods("thedarkcolour:kotlinforforge-neoforge:5.8.0") { transitive = false }
}

// One staging task per run directory, so the client and the server keep the separate mods folders
// that let them run at the same time. Optional mods dropped in by hand are left alone: only jars
// this configuration itself put there are ever removed again.
def stageDevMods(String runDirectory) {
    return tasks.register("stage${runDirectory.split('-')*.capitalize().join()}Mods", Copy) {
        group = 'minecraft'
        description = "Stages the MineColonies mod set into ${runDirectory}/mods."
        from configurations.devMods
        into project.file("${runDirectory}/mods")
        doFirst {
            def staged = configurations.devMods.resolvedConfiguration.resolvedArtifacts
                    *.moduleVersion*.id*.name
            delete(fileTree("${runDirectory}/mods") { include '*.jar' }
                    .filter { jar -> staged.any { name -> jar.name.startsWith("${name}-") } }
                    .files)
        }
    }
}

def stageClientMods = stageDevMods('run-client')
def stageServerMods = stageDevMods('run-server')

neoForge {
    version = neoforge_version

    // NeoForge runs on Mojang's official names, the same mappings the 1.20.1 project maps to,
    // which is what lets common/ compile against both without a preprocessor. There is also no
    // reobfuscation step here for the same reason.

    // ModDevGradle only puts Minecraft on the main source set's classpath, and the tests compile
    // against common/. Deliberately not `unitTest { enable() }`: that starts a real NeoForge.
    addModdingDependenciesTo sourceSets.test

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            additionalRuntimeClasspathConfiguration.extendsFrom configurations.bundledLibs
        }

        client {
            client()
            gameDirectory = project.file('run-client')
            taskBefore stageClientMods
        }

        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            taskBefore stageServerMods
        }
    }
}