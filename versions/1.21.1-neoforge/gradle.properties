# Everything that is specific to Minecraft 1.21.1 on NeoForge.
#
# Gradle does not read a subproject's gradle.properties by itself — gradle/mod-common.gradle
# loads this file explicitly and exposes every key here both as a project property and as a
# ${placeholder} in META-INF/neoforge.mods.toml and pack.mcmeta. Root properties and -P
# overrides win.

# Which loader this target builds for. Ends up in the jar name: colonyweb-1.21.1-neoforge-<version>.jar
loader=neoforge
# NeoForge 21.1 requires Java 21. The toolchain is per target, so CI has to pick a matching JDK.
java_version=21

minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# NeoForge versions its own way: 21.1.x is the 1.21.1 line.
neoforge_version=21.1.244
neoforge_version_range=[21.1,)
# FML's own version, which NeoForge bumps far less often than the loader.
loader_version_range=[4,)
# Resource pack format for this Minecraft version, substituted into pack.mcmeta.
# 1.21/1.21.1 is 34; see https://minecraft.wiki/w/Pack_format
pack_format=34

# Development runtime dependency versions. These populate runClient/runServer but are not
# bundled into ColonyWeb; production servers still install their own MineColonies mod set.
#
# The 1.21.1 line numbers its artifacts the other way round from 1.20.1
# ("1.1.1362-1.21.1-snapshot", not "1.20.1-1.1.1264-snapshot") and publishes Domum Ornamentum
# under a hyphenated artifact id, so these are full version strings rather than fragments.
# The support-mod versions are the ones MineColonies itself was built against — see the
# dependencies in minecolonies-${minecolonies_version}.pom on the LDTTeam maven.
minecolonies_version=1.1.1362-1.21.1-snapshot
domum_version=1.0.223-snapshot
structurize_version=1.0.832-1.21.1-snapshot
blockui_version=1.0.199-1.21.1-snapshot
multipiston_version=1.2.51-1.21.1-snapshot
