plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

// Identity, source sets, resource templating and the LDTTeam repository.
apply from: "$rootDir/gradle/mod-common.gradle"

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Official mappings are also what NeoForge uses at runtime, so keeping this channel is what
    // lets common/ compile unchanged against both targets.
    mappings channel: mapping_channel, version: mapping_version

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output
    // locations before launching the game. It is REQUIRED to be set to true for this to function.
    copyIdeResources = true

    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Keep the integrated-client world separate from the dedicated server so both
            // development sessions can run at the same time.
            workingDirectory project.file('run-client')
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            workingDirectory project.file('run-server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file("$rootDir/common/src/main/resources/")
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Load MineColonies and its mandatory support mods in runClient/runServer. ColonyWeb still
    // integrates through reflection, so these stay off the compile classpath and are not bundled
    // in the published ColonyWeb jar.
    runtimeOnly fg.deobf("com.ldtteam:minecolonies:${minecraft_version}-${minecolonies_version}")
    runtimeOnly fg.deobf("com.ldtteam:structurize:${structurize_version}")
    runtimeOnly fg.deobf("com.ldtteam:blockui:${blockui_version}")
    runtimeOnly fg.deobf("com.ldtteam:multipiston:${multipiston_version}")
    // Domum Ornamentum publishes its runnable 1.20.1 jar with the universal classifier.
    runtimeOnly fg.deobf("com.ldtteam:domum_ornamentum:${minecraft_version}-${domum_version}:universal")
    //
    // Additional optional mods can still be dropped into the selected run directory's mods folder.
}

// Forge 1.20.1 ships obfuscated at runtime, so the jar has to be mapped back. NeoForge does not,
// which is why this step has no counterpart in the 1.21.1 project.
tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}
