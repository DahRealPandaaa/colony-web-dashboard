plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Identity, source sets, resource templating and the LDTTeam repository.
apply from: "$rootDir/gradle/mod-common.gradle"

import groovy.json.JsonOutput
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = java_version as int
    kotlinOptions.freeCompilerArgs += ['-Xjvm-default=all']
}

// Libraries the embedded web server needs at runtime. ForgeGradle does not put
// implementation deps on the game classpath, so these are nested in the mod jar
// AND placed on the dev classpath via minecraft_classpath.
// kotlin/kotlinx/slf4j are excluded — KFF 4.11.0 provides kotlin stdlib and
// shades some coroutines packages; Minecraft provides slf4j.
configurations {
    bundledLibs {
        canBeConsumed = false
        canBeResolved = true
        exclude group: 'org.jetbrains.kotlin'
        exclude group: 'org.jetbrains.kotlinx'
        exclude group: 'org.slf4j'
    }
}

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Official mappings are also what NeoForge uses at runtime, so keeping this channel is what
    // lets common/ compile unchanged against both targets.
    mappings channel: mapping_channel, version: mapping_version

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output
    // locations before launching the game. It is REQUIRED to be set to true for this to function.
    copyIdeResources = true

    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Dev-time counterpart of META-INF/jarjar.
            lazyToken('minecraft_classpath') {
                configurations.bundledLibs.resolve()
                        .collect { it.absolutePath }
                        .join(File.pathSeparator)
            }

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Keep the integrated-client world separate from the dedicated server so both
            // development sessions can run at the same time.
            workingDirectory project.file('run-client')
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            workingDirectory project.file('run-server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file("$rootDir/common/src/main/resources/")
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.20'

    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    bundledLibs 'org.nanohttpd:nanohttpd:2.3.1'

    // MineColonies and support mods — runtime only, not bundled.
    runtimeOnly fg.deobf("com.ldtteam:minecolonies:${minecraft_version}-${minecolonies_version}")
    runtimeOnly fg.deobf("com.ldtteam:structurize:${structurize_version}")
    runtimeOnly fg.deobf("com.ldtteam:blockui:${blockui_version}")
    runtimeOnly fg.deobf("com.ldtteam:multipiston:${multipiston_version}")
    runtimeOnly fg.deobf("com.ldtteam:domum_ornamentum:${minecraft_version}-${domum_version}:universal")
    runtimeOnly fg.deobf("thedarkcolour:kotlinforforge:4.11.0")
}

// Stage nested jars and write metadata.json. ForgeGradle's jarJar task emits a second
// -all archive, but the release workflow uploads every jar in build/libs — folding into
// the main jar keeps one artifact under one name.
def bundleLibs = tasks.register('bundleLibs', Sync) {
    group = 'build'
    description = 'Stages the embedded web server libraries as META-INF/jarjar entries.'
    into layout.buildDirectory.dir('jarjar')
    from(configurations.bundledLibs) { into 'META-INF/jarjar' }

    doLast {
        // Anything absent from this index is ignored by the loader, so it is written from the same
        // resolved graph the jars themselves came from. The range stays open above the bundled
        // version: if another mod ships a newer Ktor, ColonyWeb is happy to use it rather than
        // forcing two copies into the game.
        def jars = configurations.bundledLibs.resolvedConfiguration.resolvedArtifacts
                .collect { artifact ->
                    def id = artifact.moduleVersion.id
                    [identifier  : [group: id.group, artifact: id.name],
                     version     : [range: "[${id.version},)".toString(), artifactVersion: id.version],
                     path        : "META-INF/jarjar/${artifact.file.name}".toString(),
                     isObfuscated: false]
                }
        new File(destinationDir, 'META-INF/jarjar/metadata.json')
                .setText(JsonOutput.prettyPrint(JsonOutput.toJson([jars: jars])), 'UTF-8')
    }
}

// Reobfuscate — Forge ships obfuscated. Nested library jars are unaffected.
tasks.named('jar', Jar).configure {
    from bundleLibs
    finalizedBy 'reobfJar'
}
