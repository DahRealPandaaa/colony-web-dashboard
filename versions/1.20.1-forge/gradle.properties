# Everything that is specific to Minecraft 1.20.1 on Forge.
#
# Gradle does not read a subproject's gradle.properties by itself — gradle/mod-common.gradle
# loads this file explicitly and exposes every key here both as a project property and as a
# ${placeholder} in META-INF/mods.toml and pack.mcmeta. Root properties and -P overrides win.

# Which loader this target builds for. Ends up in the jar name: colonyweb-1.20.1-forge-<version>.jar
loader=forge
# Forge 1.20.1 runs on Java 17. The toolchain is per target, so CI has to pick a matching JDK.
java_version=17

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.20.1,1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.4.0
# The Forge version range can use any version of Forge as bounds or match the loader version range
forge_version_range=[47,)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[47,)
# Resource pack format for this Minecraft version, substituted into pack.mcmeta.
# 1.20.1 is 15; see https://minecraft.wiki/w/Pack_format
pack_format=15

# The mapping channel to use for mappings.
# The default set of supported mapping channels are ["official", "snapshot", "snapshot_nodoc", "stable", "stable_nodoc"].
#
# | Channel   | Version              |                                                                                |
# |-----------|----------------------|--------------------------------------------------------------------------------|
# | official  | MCVersion            | Official field/method names from Mojang mapping files                          |
# | parchment | YYYY.MM.DD-MCVersion | Open community-sourced parameter names and javadocs layered on top of official |
#
# You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
# See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
mapping_channel=official
# The mapping version to query from the mapping channel.
# This must match the format required by the mapping channel.
mapping_version=1.20.1

# Development runtime dependency versions. These populate runClient/runServer but are not
# bundled into ColonyWeb; production servers still install their own MineColonies mod set.
#
# Latest builds for Minecraft 1.20.1 (Forge) verified against CurseForge / LDTTeam:
#   * MineColonies:     the 1.20.1 branch now ships snapshot-channel builds only; 1.1.1264 is newest.
#   * Domum Ornamentum: 1.0.303 is newest for 1.20.1 (last pure -RELEASE tag for 1.20.1 is 1.0.296).
# The full maven coordinate expands to "${minecraft_version}-${..._version}", e.g.
#   com.ldtteam:minecolonies:1.20.1-1.1.1264-snapshot
#   com.ldtteam:domum_ornamentum:1.20.1-1.0.303-snapshot
minecolonies_version=1.1.1264-snapshot
domum_version=1.0.303-snapshot
structurize_version=1.20.1-1.0.806-snapshot
blockui_version=1.20.1-1.0.190-snapshot
multipiston_version=1.20-1.2.30-ALPHA
